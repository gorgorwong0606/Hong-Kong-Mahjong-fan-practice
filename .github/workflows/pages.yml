name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - name: Build static site
        run: |
          BASE="${{ steps.pages.outputs.base_path }}"
          if [ "$BASE" = "/" ]; then BASE=""; fi
          BASE="${BASE%/}"
          echo "NEXT_PUBLIC_BASE_PATH=$BASE" >> "$GITHUB_ENV"
          # GITHUB_ENV only applies to later steps, so this build must see it now.
          NEXT_PUBLIC_BASE_PATH="$BASE" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
